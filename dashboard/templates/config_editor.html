<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Config</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #17202a;
        --muted: #667085;
        --line: #d9e0ea;
        --primary: #0f766e;
        --primary-hover: #0b5f59;
        --shadow: 0 18px 50px rgba(23, 32, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      .filename {
        color: var(--muted);
        margin-top: 4px;
        font-size: 14px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      textarea {
        width: 100%;
        min-height: 65vh;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        font: 14px/1.5 Consolas, "SFMono-Regular", Menlo, monospace;
        color: #111827;
        outline: none;
      }

      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      button,
      a {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        padding: 9px 12px;
        text-align: center;
        text-decoration: none;
      }

      button {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }

      button:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="top">
        <div>
          <h1>Edit Config</h1>
          <div class="filename">{{filename}}</div>
        </div>
        <a href="/">Back</a>
      </div>

      <form method="POST" class="panel">
        <textarea name="content" spellcheck="false">{{content}}</textarea>
        <div class="actions">
          <button type="submit">Save</button>
        </div>
      </form>
    </main>
  </body>
</html>
