<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSON Preview</title>

    <link href="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.js"></script>

    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #17202a;
        --muted: #667085;
        --line: #d9e0ea;
        --primary: #0f766e;
        --shadow: 0 18px 50px rgba(23, 32, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      .subtitle {
        color: var(--muted);
        margin-top: 4px;
        font-size: 14px;
      }

      a {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--text);
        display: inline-flex;
        align-items: center;
        font-weight: 750;
        padding: 9px 12px;
        text-decoration: none;
      }

      #jsoneditor {
        width: 100%;
        height: calc(100vh - 142px);
        min-height: 560px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      div.jsoneditor {
        border: 0;
      }

      div.jsoneditor-menu {
        background: var(--primary);
        border-bottom: 0;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="top">
        <div>
          <h1>JSON Preview</h1>
          <div class="subtitle">Showing the first 50 records from this run.</div>
        </div>
        <a href="/">Back</a>
      </div>

      <div id="jsoneditor"></div>
    </main>

    <script>
      const container = document.getElementById("jsoneditor");
      const options = {
        mode: "tree",
        modes: ["tree", "view", "code"],
      };

      const editor = new JSONEditor(container, options);

      try {
        const rawData = {{ data | tojson }};
        editor.set(rawData ?? { error: "No data available" });
      } catch (e) {
        editor.set({ error: "Failed to parse JSON data: " + e.message });
      }
    </script>
  </body>
</html>
