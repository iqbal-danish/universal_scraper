<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview</title>
    <style>
      body {
        margin: 0;
        background: #f6f7f9;
        color: #17202a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .panel {
        background: white;
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(23, 32, 42, 0.08);
        overflow: hidden;
      }

      h1 {
        font-size: 22px;
        margin: 0 0 18px;
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid #d9e0ea;
        padding: 12px 14px;
        text-align: left;
        font-size: 14px;
      }

      th {
        background: #f0f3f7;
        color: #475467;
        font-size: 12px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Preview</h1>
      <section class="panel">
        <div class="table-wrap">
          <table>
            <tr>{% for k in jobs[0].keys() %}<th>{{k}}</th>{% endfor %}</tr>
            {% for job in jobs %}
            <tr>{% for v in job.values() %}<td>{{v}}</td>{% endfor %}</tr>
            {% endfor %}
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
